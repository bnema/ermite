name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Test the module alone, with the versions in go.mod (never a go.work).
  GOWORK: "off"
  GOPRIVATE: bnema.dev/ermite*

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Architecture
        run: go tool hexcheck -fail-on warn ./...
