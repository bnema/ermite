# Mocks of the ports, generated in internal/ports/mocks. Regenerate with:
# go generate ./internal/ports
template: testify
_anchors:
  mocks: &mocks
    dir: "{{.InterfaceDir}}/mocks"
    pkgname: mocks
    filename: "{{.InterfaceName}}.go"
    structname: "{{.InterfaceName}}"
    all: true
packages:
  bnema.dev/ermite/internal/ports:
    config: *mocks
