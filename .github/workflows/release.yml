name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  # Every check of ci.yml, end-to-end tests included, on the tagged commit.
  check:
    name: Check
    if: github.server_url != 'https://github.com'
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: check
    # Releases are published on ermite (git.bnema.dev); the GitHub mirror
    # receives the tags but must not publish a second release.
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Build and test the binaries before anything is published.
      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean
      - name: Smoke test
        run: |
          ./dist/ermite_linux_amd64_v1/ermite version | tee /dev/stderr | grep -qF "ermite ${GITHUB_REF_NAME}"
      # Rebuilds the same binaries (-trimpath, commit timestamp) and publishes them.
      - name: Publish
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the release image, pushes it to Gordon's CI host with this job's
  # OIDC identity and runs exactly that digest in the ermite service of
  # ermite-prod. No Gordon secret is stored here: Gordon accepts only the
  # subject repo:bnema/ermite:environment:production, for that app, service
  # and image repository. The new ermite restarts the server running this job,
  # so the job may end in error after a successful deploy: check the server
  # version.
  deploy:
    name: Deploy
    needs: check
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      GORDON_VERSION: v3.6.0
      # gordon_linux_amd64.tar.gz in the checksums.txt of that gordon release.
      GORDON_SHA256: 3eae9ef79a6b0dcc4fb42f4a1bd745d6a2857a474a0dab07f17e976f7aa75a40
      GORDON_REMOTE: https://ci.bnema.dev
      GORDON_OIDC_AUDIENCE: https://ci.bnema.dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install gordon
        run: |
          set -euo pipefail
          archive=gordon_linux_amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://git.bnema.dev/gordon/releases/download/$GORDON_VERSION/$archive"
          echo "$GORDON_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gordon
          sudo install -m 0755 "$RUNNER_TEMP/gordon" /usr/local/bin/gordon
          gordon version | head -1
      # gordon reads ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN itself and exchanges
      # the ID token at the CI host. Only the repository and digest are logged.
      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          gordon images push ermite --build -f Dockerfile \
            --build-arg VERSION="$GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME" \
            --remote "$GORDON_REMOTE" --json >push.json
          jq -e '.digest | test("^sha256:[0-9a-f]{64}$")' push.json >/dev/null
          echo "image=$(jq -r .image push.json)" >>"$GITHUB_OUTPUT"
          jq '{repository, tag, digest}' push.json
      - name: Set image
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          gordon apps set-image ermite-prod --service ermite --image "$IMAGE" \
            --remote "$GORDON_REMOTE" --json >set-image.json
          jq '{op, app, status, outcome}' set-image.json
          jq -e '.outcome == "success"' set-image.json >/dev/null
