version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - tparallel
    - unconvert
    - unused
  settings:
    gocognit:
      min-complexity: 30
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
  exclusions:
    generated: strict
    paths:
      - gen
    rules:
      - path: _test\.go
        linters: [gocognit, funlen]
