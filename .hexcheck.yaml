version: 1
components:
  domain:
    role: core
    paths:
      - internal/domain/**
  app:
    role: usecase
    paths:
      - internal/app/**
  ports:
    role: ports
    paths:
      - internal/ports/**
  adapters:
    role: adapter
    paths:
      - internal/adapters/**
  entrypoints:
    role: entrypoint
    paths:
      - cmd/**
  config:
    role: entrypoint
    paths:
      - internal/config/**
  generated:
    role: ignore
    paths:
      - gen/**
      - '**/mocks/**'
      - '**/*_templ.go'
mocking:
  generatedMockPaths:
    - internal/ports/mocks/**
  generatedMockNamePatterns:
    - '{{Interface}}'
