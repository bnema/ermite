// Internal, unversioned storage schema of ermite: issues.

syntax = "proto3";

package ermite.storage;

import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// IssueState is where an issue is in its life.
enum IssueState {
  ISSUE_STATE_UNSPECIFIED = 0;
  ISSUE_STATE_OPEN = 1;
  ISSUE_STATE_CLOSED = 2;
  // Awaiting moderation. Not stored yet.
  ISSUE_STATE_PENDING = 3;
}

// Issue is stored under the key "is/<repo>/<number:010d>". The numbers come
// from the sequence of the merge requests ("mrseq/<repo>"). The open ones are
// indexed under "isopen/<repo>/<number:010d>".
message Issue {
  int64 number = 1;
  string title = 2;
  string body = 3;
  IssueState state = 4;
  // Label of the token that opened it.
  string author = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Last comment id handed out for this issue.
  int64 comment_seq = 8;
  // True for an issue approved from the public form: its text comes from
  // an anonymous visitor and is rendered as untrusted.
  bool external = 9;
  int64 closed_by_merge_request = 10;
}

// IssueLink is stored under isref/<repo>/<issue:010d>/<mr:010d>.
message IssueLink {
  bool closes = 1;
}

// MergeRequestReferences is stored under mrref/<repo>/<mr:010d>.
message MergeRequestReferences {
  repeated int64 issues = 1;
  repeated int64 closes = 2;
}

// IssueComment is stored under the key
// "isc/<repo>/<number:010d>/<id:010d>".
message IssueComment {
  int64 id = 1;
  string author = 2;
  string text = 3;
  google.protobuf.Timestamp created_at = 4;
}

// PendingIssue is an issue submitted through the public form, stored under
// the key "ispend/<repo>/<id>" where id is 16 random bytes in lowercase base32.
// It has no number until the owner approves it.
message PendingIssue {
  string title = 1;
  string body = 2;
  // Display name given by the submitter. May be empty.
  string author = 3;
  google.protobuf.Timestamp created_at = 4;
  // HMAC-SHA256 of the client key (32 bytes).
  bytes ip_hash = 5;
}

// IssueBan is stored under the key "isban/<hex of the hash>".
message IssueBan {
  google.protobuf.Timestamp until = 1;
}

// IssueKey is stored under the key "meta/issuekey".
message IssueKey {
  bytes key = 1;
}
