// Internal, unversioned storage schema of ermite: the values kept in ermite-kv.

syntax = "proto3";

package ermite.storage;

import "ermite/storage/merge_request.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// Visibility is the access level of a repository.
enum Visibility {
  // Unset. Readers treat it as private.
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_PUBLIC = 2;
}

// Repo is stored under the key "repo/<name>".
message Repo {
  string name = 1;
  string description = 2;
  Visibility visibility = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset until the first push.
  google.protobuf.Timestamp pushed_at = 5;
  // Unset on repositories stored before merge requests: they read as the
  // default settings.
  RepoSettings settings = 6;
  // Normalized and sorted; empty on repositories stored before topics.
  repeated string topics = 7;
  // Latest push, merge request or issue activity; unset until recorded.
  google.protobuf.Timestamp active_at = 8;
  bool archived = 9;
}

// SchemaVersion is stored under the key "meta/schema".
message SchemaVersion {
  uint32 version = 1;
}

// Token is stored under the key "token/<id>"; the key "tokenhash/<hex>" maps
// the SHA-256 of the secret back to the id.
message Token {
  string id = 1;
  string label = 2;
  // SHA-256 of the secret, 32 bytes.
  bytes hash = 3;
  // Scopes in their text form, such as "repo:read". Never empty.
  repeated string scopes = 4;
  // Repository names the token is limited to; empty means every repository.
  repeated string repos = 5;
  // Unset for a token that never expires.
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  // Unset until the token is first used.
  google.protobuf.Timestamp last_used_at = 8;
  // Branch prefixes, each ending with "/", that the token may write; empty
  // means every branch. Added in storage schema 2.
  repeated string branch_prefixes = 9;
}
