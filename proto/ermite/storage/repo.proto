// Internal, unversioned storage schema of ermite: the values kept in ermite-kv.

syntax = "proto3";

package ermite.storage;

import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// Visibility is the access level of a repository.
enum Visibility {
  // Unset. Readers treat it as private.
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_PUBLIC = 2;
}

// Repo is stored under the key "repo/<name>".
message Repo {
  string name = 1;
  string description = 2;
  Visibility visibility = 3;
  google.protobuf.Timestamp created_at = 4;
  // Unset until the first push.
  google.protobuf.Timestamp pushed_at = 5;
}

// SchemaVersion is stored under the key "meta/schema".
message SchemaVersion {
  uint32 version = 1;
}
