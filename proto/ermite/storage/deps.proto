syntax = "proto3";
package ermite.storage;
import "google/protobuf/timestamp.proto";
option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// DepRef identifies an ignored or proposed dependency version.
message DepRef {
  string ecosystem = 1;
  string directory = 2;
  string name = 3;
  string version = 4;
}
message DepName {
  string ecosystem = 1;
  string name = 2;
}
message DepUpdate {
  DepRef ref = 1;
  string current = 2;
  int32 kind = 3;
  bool new = 4;
  string new_name = 5;
}
message DepBatch {
  string key = 1;
  repeated DepUpdate updates = 2;
  int32 state = 3;
  string error = 4;
  int64 run_id = 5;
  repeated DepUpdate run_updates = 6;
  int64 mr = 7;
  repeated DepRef mr_versions = 8;
  // the updates the merge request holds, with their current versions
  repeated DepUpdate mr_updates = 9;
  string branch = 10;
  string head = 11;
  bool adopted = 12;
  google.protobuf.Timestamp queued_at = 13;
  bool manual = 14;
  repeated string repro = 15;
  // the draft heads Bernard pushed on the branch, newest last (bounded)
  repeated DepDraft drafts = 16;
  // a commit Bernard is moving the branch to, and the head it moves from
  string pending = 17;
  string pending_prev = 18;
}
// DepDraft is a manifest-only head Bernard pushed; created: the push created
// the branch.
message DepDraft {
  string sha = 1;
  bool created = 2;
}
// RepoDeps is the whole record under dpend/<repo>.
message RepoDeps {
  string repo = 1;
  // moved into batches by the schema 12 upgrade; read only by it
  repeated DepUpdate updates = 2 [deprecated = true];
  google.protobuf.Timestamp checked_at = 3;
  google.protobuf.Timestamp snoozed_until = 4;
  // moved into batches by the schema 12 upgrade; read only by it
  int32 state = 5 [deprecated = true];
  // moved into batches by the schema 12 upgrade; read only by it
  string error = 6 [deprecated = true];
  // Unused since schema 10 (the job is a CI run, see run_id): never read,
  // never written; the schema 10 upgrade clears it. Kept, not reserved, so that
  // buf breaking accepts the change.
  string job_id = 7 [deprecated = true];
  // moved into batches by the schema 12 upgrade; read only by it
  int64 mr = 8 [deprecated = true];
  // moved into batches by the schema 12 upgrade; read only by it
  repeated DepRef mr_versions = 9 [deprecated = true];
  // The CI run applying the updates, or the last one that tried; 0 for none.
  // moved into batches by the schema 12 upgrade; read only by it
  int64 run_id = 10 [deprecated = true];
  // Every pending update when the run started: what the run commits.
  // moved into batches by the schema 12 upgrade; read only by it
  repeated DepUpdate run_updates = 11 [deprecated = true];
  repeated DepBatch batches = 12;
  bool auto_open_disabled = 13;
  repeated DepName split_out = 14;
}
// DepFirstSeen is global, under dseen/<ecosystem>/<name>@<version>@<sha>.
message DepFirstSeen {
  google.protobuf.Timestamp at = 1;
}
