// Internal, unversioned storage schema of ermite: CI runs, jobs, checks and
// runners (ADR 0025). Logs are not stored here: they are files under
// $ERMITE_DATA_DIR/ci/logs.

syntax = "proto3";

package ermite.storage;

import "ermite/storage/deps.proto";
import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// CIStatus is where a run, a job or a check is in its life.
enum CIStatus {
  CI_STATUS_UNSPECIFIED = 0;
  CI_STATUS_QUEUED = 1;
  CI_STATUS_IN_PROGRESS = 2;
  CI_STATUS_COMPLETED = 3;
  // Held back by a concurrency group (jobs and checks only).
  CI_STATUS_PENDING = 4;
}

// CIConclusion is how a run, a job, a step or a check ended.
enum CIConclusion {
  CI_CONCLUSION_UNSPECIFIED = 0;
  CI_CONCLUSION_SUCCESS = 1;
  CI_CONCLUSION_FAILURE = 2;
  CI_CONCLUSION_CANCELLED = 3;
  CI_CONCLUSION_SKIPPED = 4;
  CI_CONCLUSION_TIMED_OUT = 5;
  CI_CONCLUSION_NEUTRAL = 6;
  CI_CONCLUSION_ACTION_REQUIRED = 7;
}

// CIStepState is where a step is in its life.
enum CIStepState {
  CI_STEP_STATE_UNSPECIFIED = 0;
  CI_STEP_STATE_PENDING = 1;
  CI_STEP_STATE_IN_PROGRESS = 2;
  CI_STEP_STATE_COMPLETED = 3;
}

// CIJobPhase is where a job is for the server.
enum CIJobPhase {
  CI_JOB_PHASE_UNSPECIFIED = 0;
  // Waits for the jobs it needs, or for a free max-parallel slot.
  CI_JOB_PHASE_WAITING = 1;
  // Planned and waiting for a runner.
  CI_JOB_PHASE_READY = 2;
  // Given to a runner that has not acknowledged it yet.
  CI_JOB_PHASE_ASSIGNED = 3;
  // Acknowledged by its runner.
  CI_JOB_PHASE_RUNNING = 4;
  // Over.
  CI_JOB_PHASE_ENDED = 5;
}

// CIIsolation is how a runner isolates jobs.
enum CIIsolation {
  CI_ISOLATION_UNSPECIFIED = 0;
  CI_ISOLATION_VM = 1;
  CI_ISOLATION_CONTAINER_SYSBOX = 2;
  CI_ISOLATION_CONTAINER_PRIVILEGED = 3;
}

// CICancelReason says why a job is asked to stop.
enum CICancelReason {
  CI_CANCEL_REASON_UNSPECIFIED = 0;
  CI_CANCEL_REASON_USER = 1;
  CI_CANCEL_REASON_FAIL_FAST = 2;
  CI_CANCEL_REASON_TIMEOUT = 3;
}

// CIRun is stored under "run/<repo>/<id:020d>".
message CIRun {
  // 18 and 19 were the workflow file and the github context, which moved to
  // CIRunSource.
  reserved 18, 19;
  string repo = 1;
  int64 id = 2;
  int64 number = 3;
  int32 attempt = 4;
  string workflow_path = 5;
  string workflow_name = 6;
  string title = 7;
  string event = 8;
  string ref = 9;
  string sha = 10;
  string actor = 11;
  CIStatus status = 12;
  CIConclusion conclusion = 13;
  string error = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp completed_at = 17;
  bool cancel_requested = 20;
  google.protobuf.Timestamp cancel_requested_at = 21;
  // name is GitHub's name of the run: the evaluated run-name, else the
  // workflow name. Empty in runs stored before it existed (read as
  // workflow_name).
  string name = 22;
  // trusted: the actor of the run is the owner, so its jobs get secrets. False
  // in runs stored before it existed (the safe reading).
  bool trusted = 23;
  // The evaluated workflow-level concurrency of the attempt.
  CIConcurrency concurrency = 24;
  // head_sha: the head of the merge request of a pull_request run, where sha is
  // the test merge commit. Empty for the other events.
  string head_sha = 25;
  // pull_number: the merge request of a pull_request or pull_request_target
  // run, 0 for the other events and in runs stored before it existed.
  int64 pull_number = 26;
}

// CIRunSource is stored under "runsrc/<run id:020d>": what a run was planned
// from, kept apart so that listing runs does not decode it.
message CIRunSource {
  int64 run_id = 4;
  // The workflow file at sha, as is.
  string workflow_yaml = 1;
  // The "github" context of the run as JSON, without "job" and "run_attempt".
  string github_json = 2;
  // Repository of the run: the key of the run record is run/<repo>/<id>, and
  // the runner side knows a run by its id only.
  string repo = 3;
  // Who pushed the commit: "root", "owner", "token" or empty (a run stored
  // before it was recorded, or pushed by nobody). pusher_token_id is the ID of
  // the stored token for "token". What a token may read is looked up live.
  string pusher_kind = 5;
  string pusher_token_id = 6;
}

// CIStep is a step of a job.
message CIStep {
  // 8 and 10 were the end of the step, which is derived from the next step's
  // start and the line count.
  reserved 8, 10;
  int32 number = 1;
  string name = 2;
  CIStepState state = 3;
  CIConclusion conclusion = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp completed_at = 6;
  // Number of the first log line of the step; meaningful with has_lines. The
  // end of a step is the start of the next step that has lines, or the line
  // count of the job: it is never stored.
  int64 log_start = 7;
  bool has_lines = 9;
  // How the step ended before continue-on-error was applied; unspecified for
  // a step stored before the field existed (read it as conclusion).
  CIConclusion outcome = 11;
}

// CIJob is stored under "job/<run_id:020d>/<run_attempt:010d>/<job id>".
message CIJob {
  // 36 was the line count of the log, which the log file holds.
  reserved 36;
  string id = 1;
  int64 run_id = 2;
  // Attempt in which the job executed (the one of its log).
  int32 attempt = 3;
  string repo = 4;
  string key = 5;
  string name = 6;
  CIJobPhase phase = 7;
  CIConclusion conclusion = 8;
  string error = 9;
  repeated string labels = 10;
  repeated string needs = 11;
  string runner_id = 12;
  string runner_name = 13;
  CIIsolation isolation = 14;
  repeated CIStep steps = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp started_at = 17;
  google.protobuf.Timestamp completed_at = 18;
  // Position of the job in the workflow file, and of the instance in its
  // matrix. A combo of -1 is a job whose matrix is not expanded yet.
  int32 index = 19;
  int32 combo = 20;
  string matrix_json = 21;
  // Number of instances of the job's matrix, for the strategy context.
  int32 combo_total = 22;
  int32 timeout_minutes = 23;
  bool fail_fast = 24;
  int32 max_parallel = 25;
  map<string, string> outputs = 26;
  bytes token_hash = 27;
  google.protobuf.Timestamp ready_at = 28;
  google.protobuf.Timestamp assigned_at = 29;
  google.protobuf.Timestamp acked_at = 30;
  int32 assign_cancels = 31;
  google.protobuf.Timestamp token_valid_until = 32;
  CICancelReason cancel_reason = 33;
  string cancel_message = 34;
  google.protobuf.Timestamp cancel_requested_at = 35;
  // Set when the job is planned: runs-on, name and contexts are evaluated.
  bool planned = 37;
  // Attempt of the run this record belongs to; it is the key. A job kept by a
  // re-run of the failed jobs is copied with the run attempt of the re-run and
  // keeps its own attempt.
  int32 run_attempt = 38;
  // The contexts JSON given to the runner, computed when the job is planned
  // (needs outputs are final then). No longer written: stored under jobctx/
  // instead. Retained as a read fallback for legacy records.
  string contexts_json = 39;
  // The job's continue-on-error, evaluated when the job is planned: a failure
  // of the job does not fail the run, does not cancel the siblings of its
  // matrix, and needs.<job>.result is success.
  bool continue_on_error = 40;
  // The evaluated environment: of the job, set when the job is planned; empty
  // for none. Its secrets and variables are read when the job is assigned.
  string environment = 41;
  // The effective permissions of the job's repository token (D3), computed when
  // the job is planned: permission key to "read", "write" or "none". Absent on
  // a job planned before the field existed: the restricted default.
  map<string, string> permissions = 42;
  // The job's concurrency group (its own, else the one of its run) and where
  // it is in it.
  CIConcurrency concurrency = 43;
  // Reusable workflows (D7). scope is the id of the record of the job that
  // called the workflow this job belongs to, empty for a job of the run's own
  // workflow; call_id is the id of the job in that called workflow (key is
  // "<caller key>/<call id>"). call is set on the record that stands for a job
  // calling a reusable workflow: it never runs, it ends when the jobs of its
  // scope have.
  string scope = 44;
  string call_id = 45;
  CICall call = 46;
  // Set on the only job of a dependency run (Bernard): the updates the runner
  // applies. Such a job is created ready and never planned from a workflow.
  CIDepsJob deps = 47;
}

// CIDepsJob is what a runner applies for a dependency job.
message CIDepsJob {
  repeated DepRef updates = 1;
  string go_version = 2;
}

// CICall is the call a reusable-workflow job makes, set when the calling job is
// planned. The called workflow's file is kept here, so that the jobs of the call
// are planned and run from the file of the commit that was resolved.
message CICall {
  string uses = 1;
  // path of the file in its repository, repository as "owner/repo" (github.com)
  // or the name of the repository on this server, ref as the calling workflow
  // wrote it ("" for a local call), sha the commit it resolved to.
  string path = 2;
  string repository = 3;
  string ref = 4;
  string sha = 5;
  string yaml = 6;
  // inputs_json is the inputs context of the called workflow: the values given
  // and the defaults, typed.
  string inputs_json = 7;
  // secrets holds the names of the secrets of the called workflow that the
  // calling workflow's "secrets:" gives (upper case), with an empty value: the
  // expressions are not stored. They are read as template tokens from the pinned
  // workflow file of the caller when a job is assigned, and evaluated once there.
  map<string, string> secrets = 8;
  bool inherit = 9;
  int32 depth = 10;
  // expanded: the jobs of the called workflow exist.
  bool expanded = 11;
  // concurrency is the workflow-level group of the called workflow, evaluated
  // with the caller's github context and the call's inputs when the call is
  // planned. The call record is its entry, like the group of the calling job
  // (CIJob.concurrency): the jobs of the call run once the call holds both.
  CIConcurrency concurrency = 12;
  // admitted: the call may start (the max-parallel of the calling job's
  // strategy allows it); it asks for its groups and plans its jobs only then.
  bool admitted = 13;
  // secret_ctx is the JSON of the contexts the "secrets:" expressions read apart
  // from the secrets, as they were when the call was planned: needs, matrix,
  // strategy, inputs and vars of the calling scope (none is secret). Plain data,
  // never interpreted as a reference; the vars are the caller's, not those of
  // the environment of the job that is assigned.
  string secret_ctx = 14;
}

// CICheck is stored under "check/<repo>/<sha>/<id>": the id of its job, or
// "run-<run id>" for a run that failed without a job (invalid workflow file).
message CICheck {
  string id = 1;
  string repo = 2;
  string sha = 3;
  string name = 4;
  CIStatus status = 5;
  CIConclusion conclusion = 6;
  int64 run_id = 7;
  string job_id = 8;
  int32 attempt = 9;
  string workflow_name = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp completed_at = 13;
}

// CIRunner is stored under "runner/<id>".
message CIRunner {
  string id = 1;
  string name = 2;
  repeated string labels = 3;
  CIIsolation isolation = 4;
  string version = 5;
  string arch = 6;
  string os = 7;
  google.protobuf.Timestamp registered_at = 8;
  bytes token_hash = 9;
}

// CIRepoToken is a job repository token (the "github.token" of a job, or the
// token of one action archive), stored under "ghtoken/<id>". The secret is
// never stored: "ghtokenhash/<sha256 hex>" maps its hash to the id,
// "ghtokenjob/<run:020d>/<run attempt:010d>/<job id>/<id>" lists the tokens of a
// job so that they are revoked together, and "ghtokenrepo/<repo>/<id>" the
// tokens that read a repository, so that they go with it.
message CIRepoToken {
  string id = 1;
  bytes hash = 2;
  // The one repository the token reads.
  string repo = 3;
  // The job the token belongs to: it is revoked when the job ends.
  int64 run_id = 4;
  int32 run_attempt = 5;
  string job_id = 6;
  // Set for the token of an action archive, unset for the job's own token.
  bool archive = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  // The commit an archive token downloads.
  string sha = 10;
  // The permissions of a job's own token (key to "read", "write" or "none");
  // what it may do on its repository follows from them (domain.RepoTokenPrincipal).
  // Absent: the restricted default, read-only, as tokens issued before the
  // field existed (an older binary reads a newer token as read-only too).
  map<string, string> permissions = 11;
  // Set for the ID token request token of the job ("ermiteoidc_"), which only
  // the OIDC token endpoint accepts. A binary that predates the field reads it
  // as a job's own token, but never looks it up: it only resolves secrets with
  // the "ermitegh_" prefix, whose hashes are not those of these tokens.
  bool oidc = 12;
}

// CIActionResolution is the resolution of an action reference for a run
// attempt, stored under "actres/<run:020d>/<run attempt:010d>/<sha256 of key>"
// so that every job of the attempt gets the same commit.
message CIActionResolution {
  // "owner/repo@ref", lower-cased owner and repository.
  string key = 1;
  string name_with_owner = 2;
  string resolved_sha = 3;
  // 1 = github.com, 2 = this server (the numbers of ActionSource).
  int32 source = 4;
}

// CIAnnotationLevel is the severity of an annotation.
enum CIAnnotationLevel {
  CI_ANNOTATION_LEVEL_UNSPECIFIED = 0;
  CI_ANNOTATION_LEVEL_NOTICE = 1;
  CI_ANNOTATION_LEVEL_WARNING = 2;
  CI_ANNOTATION_LEVEL_FAILURE = 3;
}

// CIAnnotation is a message attached to a step of a job.
message CIAnnotation {
  CIAnnotationLevel level = 1;
  string title = 2;
  string message = 3;
  string file = 4;
  int32 start_line = 5;
  int32 end_line = 6;
  int32 start_column = 7;
  int32 end_column = 8;
}

// CIStepAnnotations holds all the annotations of one step of one execution of
// a job, in the order the step produced them. It is stored under
// "annot/<run:020d>/<job attempt:010d>/<job id>/<step:010d>"; a step without
// annotation has no key. The runner replaces the whole value at each report.
message CIStepAnnotations {
  repeated CIAnnotation annotations = 1;
}

// CIConcurrencyState is where a run or a job is in its concurrency group.
enum CIConcurrencyState {
  CI_CONCURRENCY_STATE_UNSPECIFIED = 0;
  // Another entry of the group runs: this one waits.
  CI_CONCURRENCY_STATE_PENDING = 1;
  // This entry is the running one of its group.
  CI_CONCURRENCY_STATE_HOLDING = 2;
  // Only in a CIConcurrencyMark: a newer entry replaced this one, which is owed
  // a cancellation and may never acquire the group.
  CI_CONCURRENCY_STATE_REPLACED = 3;
}

// CIConcurrency is the evaluated "concurrency:" of a run or a job, kept on its
// record (CIRun.concurrency, CIJob.concurrency).
message CIConcurrency {
  string group = 1;
  bool cancel = 2;
  CIConcurrencyState state = 3;
  // evaluated: the expressions were evaluated, whatever the result.
  bool evaluated = 4;
  // from_run: a job that shows the group of its run and holds nothing itself.
  bool from_run = 5;
  // preempted: cancelled because a newer entry of the group asked for it; the
  // job ends with GitHub's annotation.
  bool preempted = 6;
  // queue_max: queue: max (false is queue: single, the default).
  bool queue_max = 7;
}

// CIConcurrencyEntry is a run (job_id empty) or a job in a concurrency group.
message CIConcurrencyEntry {
  int64 run_id = 1;
  int32 attempt = 2;
  string job_id = 3;
  bool cancel = 4;
  // canceling: a waiting entry with cancel-in-progress asked this running one
  // to stop; the entry stays until it has ended.
  bool canceling = 5;
  // queue_max: the entry was queued with queue: max.
  bool queue_max = 6;
}

// CIConcurrencyRecord is stored under "concur/<repo>/<key(group)>" (ConcurrencyKey): the
// running entry and the waiting ones of a group. A group with neither has no
// key.
message CIConcurrencyRecord {
  // 3 held the cancellations owed to replaced entries; a replaced entry is now
  // found from its own record (it waits in a group that does not name it).
  reserved 3;
  CIConcurrencyEntry running = 1;
  // pending is the head of queue, written for the binaries that predate queue
  // (a downgrade keeps the first waiting entry; the others, which their record
  // no longer names, are cancelled as replaced). It is read when queue is
  // empty: a record stored by such a binary.
  CIConcurrencyEntry pending = 2;
  // queue holds the waiting entries, first in first out.
  repeated CIConcurrencyEntry queue = 4;
}

// CIRefTip is stored under "cireftip/<repo>/<full ref name>" (a branch or a
// tag): who moves the ref to the object sha, so that a scheduled or dispatched
// run on it takes their actor and trust (domain.CIRefTip). It is written before
// the ref moves, and names the object it is for: a record of another object
// than the ref's is not valid.
message CIRefTip {
  string sha = 1;
  // The actor the run shows ("owner", "root" or a token label).
  string actor = 2;
  bool trusted = 3;
  // As CIRunSource: "root", "owner", "token" or empty.
  string pusher_kind = 4;
  string pusher_token_id = 5;
}

// CIConcurrencyMark is stored under
// "concurmark/<repo>/<escaped key(group)>/<run:020d>/<attempt:010d>/<job id or ->":
// where an entry stands in its group. It is written in the same batch as the
// group record ("concur/..."), so that an entry is marked pending or holding if
// and only if the record names it; an entry the record stops naming because a
// newer one replaced it is marked replaced in that very batch. The mark is
// removed with the entry (it ended, was released, or is gone).
message CIConcurrencyMark {
  CIConcurrencyEntry entry = 1;
  // group as the newest request wrote it, for the cancel annotation.
  string group = 2;
  CIConcurrencyState state = 3;
  // queue_full: with state REPLACED, the entry was a queue: max entry that
  // found the waiting line full (its annotation says so). Stored as REPLACED so
  // that a binary that predates it still cancels the entry.
  bool queue_full = 4;
}

// CIWorkflowDisabled is stored under "ciwfoff/<repo>/<workflow path>" (the path
// is ".github/workflows/<file>"): the workflow is disabled and starts no run.
// The file does not have to exist. It goes with the repository.
message CIWorkflowDisabled {
  google.protobuf.Timestamp disabled_at = 1;
}
