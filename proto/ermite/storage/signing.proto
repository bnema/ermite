// Internal, unversioned storage schema of ermite: the commit signing key and
// the trusted signing keys.

syntax = "proto3";

package ermite.storage;

import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// SigningKey is stored under the key "signing/key". The seed is the private
// key: it must never be logged.
message SigningKey {
  // The 32-byte seed of an ed25519 key.
  bytes seed = 1;
  google.protobuf.Timestamp created_at = 2;
}

// TrustedKey is stored under the key "signing/trusted/<id>": a public key
// whose commit signatures ermite accepts for the listed committer emails.
message TrustedKey {
  // The fingerprint: "SHA256:<base64>" for SSH, upper-case hex for GPG.
  string id = 1;
  // "ssh" or "gpg".
  string format = 2;
  string title = 3;
  // An authorized_keys line (SSH) or an armored public key block (GPG).
  string public_key = 4;
  repeated string emails = 5;
  google.protobuf.Timestamp created_at = 6;
}
