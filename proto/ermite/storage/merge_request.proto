// Internal, unversioned storage schema of ermite: merge requests.

syntax = "proto3";

package ermite.storage;

import "google/protobuf/timestamp.proto";

option go_package = "bnema.dev/ermite/gen/ermite/storage;storagepb";

// MergeMode is how a merge request is merged.
enum MergeMode {
  MERGE_MODE_UNSPECIFIED = 0;
  MERGE_MODE_FAST_FORWARD = 1;
  MERGE_MODE_SQUASH = 2;
  MERGE_MODE_MERGE = 3;
}

// RepoSettings are the merge settings of a repository, stored inside Repo.
message RepoSettings {
  // Never empty once stored.
  repeated MergeMode allowed_merge_modes = 1;
  // Unused: never read, never written.
  bool failing_checks_block = 2 [deprecated = true];
  // Who may write issues; unspecified reads as off.
  IssuesMode issues = 3;
  // Set on every write since merge commits exist: the modes are the explicit
  // choice of the owner. When false (settings stored before), exactly
  // {fast-forward, squash} was the old default and gains MERGE_MODE_MERGE on
  // read.
  bool merge_modes_v2 = 4;
  bool allow_auto_merge = 5;
  bool ci_auto_cancel_disabled = 6;
}

// IssuesMode says who may write issues in a repository.
enum IssuesMode {
  ISSUES_MODE_UNSPECIFIED = 0;
  ISSUES_MODE_OFF = 1;
  ISSUES_MODE_OWNER = 2;
  ISSUES_MODE_PUBLIC = 3;
}

// MergeRequestState is where a merge request is in its life.
enum MergeRequestState {
  MERGE_REQUEST_STATE_UNSPECIFIED = 0;
  MERGE_REQUEST_STATE_OPEN = 1;
  MERGE_REQUEST_STATE_MERGED = 2;
  MERGE_REQUEST_STATE_CLOSED = 3;
}

// DiffSide is the side of a diff a comment is attached to.
enum DiffSide {
  // A general comment.
  DIFF_SIDE_UNSPECIFIED = 0;
  DIFF_SIDE_OLD = 1;
  DIFF_SIDE_NEW = 2;
}

// MergeRequest is stored under the key "mr/<repo>/<number:010d>".
message MergeRequest {
  int64 number = 1;
  string title = 2;
  string description = 3;
  string source_branch = 4;
  string target_branch = 5;
  MergeRequestState state = 6;
  // Label of the token that opened it.
  string author = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Head of the source branch when the request was merged or closed; empty
  // while it is open (the head is read from Git then).
  string head_id = 10;
  // Merge base of the target and the head when the request was merged or
  // closed, so that its diff stays readable after the merge.
  string base_id = 11;
  string merged_commit_id = 12;
  MergeMode merge_mode = 13;
  // Last comment id handed out for this request.
  int64 comment_seq = 14;
  // Pending auto-merge; unset when off.
  AutoMerge auto_merge = 15;
  bool auto_merged = 16;
}

// AutoMerge is the pending auto-merge of an open merge request.
message AutoMerge {
  MergeMode mode = 1;
  string head_id = 2;
  // Kind and token id of the CIPusher that enabled it.
  string enabler_kind = 3;
  string enabler_token_id = 4;
  string enabler_label = 5;
  google.protobuf.Timestamp enabled_at = 6;
}

// Verdict is the immutable review decision of a note.
enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_APPROVE = 1;
  VERDICT_CHANGES_REQUESTED = 2;
}

// Comment is stored under the key "mrc/<repo>/<number:010d>/<id:010d>".
message Comment {
  int64 id = 1;
  string author = 2;
  string path = 3;
  int32 line = 4;
  DiffSide side = 5;
  string commit_id = 6;
  string text = 7;
  bool resolved = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 reply_to = 10;
  int32 start_line = 11;
  Verdict verdict = 12;
  google.protobuf.Timestamp edited_at = 13;
  bool deleted = 14;
}

// Sequence is stored under the key "mrseq/<repo>": the last merge request
// number handed out for the repository.
message Sequence {
  int64 last = 1;
}

// MergeabilityState is the outcome of a mergeability check. "Checking" is
// never stored.
enum MergeabilityState {
  MERGEABILITY_STATE_UNSPECIFIED = 0;
  MERGEABILITY_STATE_UP_TO_DATE = 1;
  MERGEABILITY_STATE_BEHIND = 2;
  MERGEABILITY_STATE_CONFLICT = 3;
}

// Mergeability is stored under the key "mrmerge/<repo>/<number:010d>": a
// derived, discardable record of an open merge request.
message Mergeability {
  MergeabilityState state = 1;
  string target_id = 2;
  string head_id = 3;
  int32 behind = 4;
  bool behind_capped = 5;
  repeated string conflict_paths = 6;
  bool conflict_paths_truncated = 7;
  google.protobuf.Timestamp checked_at = 8;
}
